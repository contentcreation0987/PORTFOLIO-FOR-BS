<!-- @dsCard group="Colors" viewport="700x170" name="Rules & scrims" subtitle="Hairline, strong, on-media — plus the bottom-up media scrim." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr 180px;gap:16px;align-items:end">
<div><hr style="border:0;border-top:1px solid var(--rule-hairline);margin:0 0 8px"><span style="font:400 11px var(--font-mono);color:var(--text-quiet)">--rule-hairline</span></div>
<div><hr style="border:0;border-top:1px solid var(--rule-strong);margin:0 0 8px"><span style="font:400 11px var(--font-mono);color:var(--text-quiet)">--rule-strong</span></div>
<div style="background:var(--void);padding:12px"><hr style="border:0;border-top:1px solid var(--rule-on-media);margin:0 0 8px"><span style="font:400 11px var(--font-mono);color:rgba(250,248,245,.6)">--rule-on-media</span></div>
<div style="height:96px;background:var(--void);position:relative"><div style="position:absolute;inset:0;background:var(--media-scrim)"></div><span style="position:absolute;left:10px;bottom:8px;font:400 11px var(--font-mono);color:var(--text-on-media)">--media-scrim</span></div>
</div></body></html>

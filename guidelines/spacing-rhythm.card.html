<!-- @dsCard group="Spacing" viewport="700x260" name="Gutter & rhythm in use" subtitle="One gutter, three stack steps, one section rhythm." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}body{padding:0}</style></head><body>
<div style="background:var(--surface-raised);padding-inline:var(--gutter);padding-block:32px;position:relative">
<div style="position:absolute;inset:0 auto 0 0;width:var(--gutter);background:rgba(161,98,7,.1)"></div>
<div style="position:absolute;inset:0 0 0 auto;width:var(--gutter);background:rgba(161,98,7,.1)"></div>
<div style="display:grid;gap:var(--stack-tight)"><div style="font:500 var(--fs-label) var(--font-core);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-label)">Concept</div>
<p style="margin:0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-quiet);max-width:var(--measure-body)">--stack-tight between a label and its copy.</p></div>
<div style="height:var(--stack)"></div>
<div style="font:400 11px var(--font-mono);color:var(--text-label)">↕ --stack (24px) between blocks</div>
<div style="height:var(--stack-loose)"></div>
<div style="font:400 11px var(--font-mono);color:var(--text-label)">↕ --stack-loose (48px) between passages</div>
<div style="margin-top:24px;font:400 11px var(--font-mono);color:var(--text-accent)">--gutter clamp(20px, 5.5vw, 72px) shown tinted · --section-y clamp(72px, 14vw, 176px)</div>
</div></body></html>

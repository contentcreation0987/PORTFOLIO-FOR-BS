<!-- @dsCard group="Motion" viewport="700x190" name="Reveal — the whole motion system" subtitle="Fade + 14px rise, 640ms, once on scroll-in. Nothing else." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}@keyframes rv{0%,12%{opacity:0;transform:translateY(14px)}46%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(14px)}}.d{animation:rv 3.4s var(--ease-out) infinite}</style></head><body>
<div style="display:grid;gap:16px;max-width:var(--measure-body)">
<div class="d" style="font-family:var(--font-display);font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:.9;color:var(--text-display)">Retro State</div>
<div class="d" style="animation-delay:.08s;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-quiet)">Children stagger by --reveal-stagger (80ms). One pass only — never re-plays on scroll back.</div>
</div></body></html>
